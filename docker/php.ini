; Ajustes de PHP para el servidor.
;
; Solo lo que el proyecto necesita de verdad, con el porqué al lado. Un php.ini
; copiado de internet trae treinta directivas que nadie sabe para qué están.

; --- Errores -----------------------------------------------------------------
; Nunca en pantalla: un error de base de datos imprimiría la consulta y la ruta
; del archivo a quien esté visitando. Al registro, que es donde se leen.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; --- Subidas -----------------------------------------------------------------
; Las imágenes se reducen a 1280 px DESPUÉS de recibirlas, así que el límite
; es sobre el archivo original que manda el creador. 8 MB cubre una foto de
; celular de sobra; más arriba solo invita a llenar el disco.
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 20

; --- Memoria y tiempo --------------------------------------------------------
; 128 MB es suficiente: lo más pesado que hace el proyecto es redibujar una
; imagen con gd y armar un .zip para SCORM. Y en una máquina de 2 GB
; compartida con otro sitio, un límite alto significa que un pico se lleva por
; delante al vecino.
memory_limit = 128M
max_execution_time = 60

; --- Sesiones ----------------------------------------------------------------
; La cookie se endurece en código (`auth_iniciar()`), pero estas tres se
; aplican también a cualquier sesión que se abra por otro camino.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; --- Zona horaria ------------------------------------------------------------
date.timezone = America/Bogota

; --- Opcache -----------------------------------------------------------------
; El código no cambia hasta el siguiente despliegue, así que no hace falta que
; PHP compruebe la fecha de cada archivo en cada petición.
opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0

; --- No anunciar que esto es PHP --------------------------------------------
expose_php = Off
